version: '3.8'

services:
  # MongoDB database
  mongodb:
    image: mongo:7.0
    container_name: futurepath_mongodb
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin123
    volumes:
      - mongodb_data:/data/db
    networks:
      - futurepath_network

  # Backend server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: futurepath_backend
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin123@mongodb:27017/futurepath?authSource=admin
    depends_on:
      - mongodb
    networks:
      - futurepath_network
    command: sh -c "npm run migrate:careers && npm start"

  # Frontend server
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: futurepath_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - futurepath_network
    environment:
      VITE_API_URL: http://backend:5000/api

volumes:
  mongodb_data:

networks:
  futurepath_network:
    driver: bridge
